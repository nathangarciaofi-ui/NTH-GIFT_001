<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descarga Gratis: Remix Set - [Tu Nombre DJ/Productor]</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
        }

        .cover-art {
            width: 100%;
            height: auto;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #fff;
        }

        p.artist {
            color: #b3b3b3;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        audio {
            width: 100%;
            margin-bottom: 24px;
            border-radius: 8px;
        }

        .btn-download {
            display: inline-block;
            width: 100%;
            background-color: #1db954; /* Verde tipo Spotify */
            color: #fff;
            padding: 16px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-download:hover {
            background-color: #1ed760;
            transform: scale(1.02);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Portada del Set/Remix -->
        <img src="https://via.placeholder.com/400" alt="Cover Art" class="cover-art">

        <!-- Título del Remix -->
        <h1>Summer Remix Set 2026</h1>
        <p class="artist">Por [Tu Nombre Artístico]</p>

        <!-- Previa de Audio -->
        <audio controls>
            <source src="tu-audio-demo.mp3" type="audio/mpeg">
            Tu navegador no soporta el reproductor de audio.
        </audio>

        <!-- Botón de Descarga Directa -->
        <a href="tu-remix-completo.mp3" download class="btn-download">
            ⬇️ Descargar Remix Gratis (MP3)
        </a>

        <p class="footer-note">¡Gracias por el apoyo! Comparte este set con tus amigos.</p>
    </div>

</body>
</html>
